name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Setup Android SDK
        id: setup-android
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      - name: Install NDK
        run: |
          sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1"
          
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'
          cache-read-only: false
          
      - name: Create local.properties
        run: |
          NDK_PATH=$ANDROID_HOME/ndk/26.1.10909125
          echo "sdk.dir=$ANDROID_HOME" > app/local.properties
          echo "ndk.dir=$NDK_PATH" >> app/local.properties
          echo "cmake.dir=$NDK_PATH/cmake/3.22.1" >> app/local.properties
          cat app/local.properties
          
      - name: Generate Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.5 --distribution-type bin
          
      - name: Make gradlew executable
        run: chmod +x gradlew
          
      - name: Build Release APK
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace --info
        env:
          GRADLE_OPTS: "-Xmx4g -Dorg.gradle.daemon=false"

      - name: Build standalone binary
        continue-on-error: true
        run: |
          NDK=$ANDROID_HOME/ndk/26.1.10909125
          echo "NDK path: $NDK"
          CLANG=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android34-clang
          echo "Using clang: $CLANG"
          $CLANG -O2 -o set_render_level \
            app/src/main/cpp/native_helper.cpp \
            -DSTANDALONE_EXE \
            -llog -ldl
          chmod +x set_render_level
          file set_render_level
          
      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HighResModule-APK
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 7

      - name: Upload standalone binary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: set_render_level
          path: set_render_level
          retention-days: 7
