name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Setup Android SDK
        id: setup-android
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          ndk-version: r26c
          cache: gradle
          
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'
          cache-read-only: false
          
      - name: Create local.properties
        run: |
          echo "sdk.dir=${{ steps.setup-android.outputs.sdk-path }}" > app/local.properties
          echo "cmake.dir=${{ steps.setup-android.outputs.ndk-path }}/cmake/3.22.1" >> app/local.properties
          cat app/local.properties
          
      - name: Generate Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.5 --distribution-type bin
          
      - name: Make gradlew executable
        run: chmod +x gradlew
          
      - name: Build Release APK
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace --info
        env:
          GRADLE_OPTS: "-Xmx4g -Dorg.gradle.daemon=false"

      - name: Build standalone binary
        continue-on-error: true
        run: |
          NDK=${{ steps.setup-android.outputs.ndk-path }}
          echo "NDK path: $NDK"
          ls $NDK/toolchains/llvm/prebuilt/*/bin/aarch64-linux-android*-clang || true
          CLANG=$(ls $NDK/toolchains/llvm/prebuilt/*/bin/aarch64-linux-android*-clang 2>/dev/null | head -1)
          echo "Using clang: $CLANG"
          $CLANG -O2 -o set_render_level \
            app/src/main/cpp/native_helper.cpp \
            -DSTANDALONE_EXE \
            -llog -ldl
          chmod +x set_render_level
          file set_render_level
          
      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HighResModule-APK
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 7

      - name: Upload standalone binary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: set_render_level
          path: set_render_level
          retention-days: 7
