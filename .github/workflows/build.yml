name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Setup Android SDK
        id: setup-android
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          ndk-version: r26c
          cache: gradle
          
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'
          cache-read-only: false
          
      - name: Create local.properties
        run: |
          echo "sdk.dir=${{ steps.setup-android.outputs.sdk-path }}" > app/local.properties
          echo "cmake.dir=${{ steps.setup-android.outputs.ndk-path }}/cmake/3.22.1" >> app/local.properties
          cat app/local.properties
          
      - name: Generate Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.5 --distribution-type bin
          
      - name: Make gradlew executable
        run: chmod +x gradlew
          
      - name: Build Release APK
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace --info
        env:
          GRADLE_OPTS: "-Xmx4g -Dorg.gradle.daemon=false"
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HighResModule-APK
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 7
